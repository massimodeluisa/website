name: Sync GitHub profile data

on:
  workflow_dispatch:
    inputs:
      repository-source:
        description: Repository visibility source
        required: true
        default: authenticated
        type: choice
        options:
          - authenticated
          - public
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write

concurrency:
  group: sync-github-profile
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITHUB_USER: massimodeluisa
      GITHUB_REPOSITORY_SOURCE: ${{ inputs.repository-source || 'authenticated' }}
      GITHUB_REPO_OWNERS: ${{ vars.PORTFOLIO_REPO_OWNERS || 'massimodeluisa,smartsquad,inksquad' }}
      PROFILE_SYNC_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN || github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate repository token
        run: |
          if [ "$GITHUB_REPOSITORY_SOURCE" = "authenticated" ] && [ -z "$PROFILE_SYNC_TOKEN" ]; then
            echo "::error::Set PORTFOLIO_GITHUB_TOKEN to a fine-grained personal access token with Metadata: read for the repositories you want listed. The default GITHUB_TOKEN is scoped to this workflow repository and cannot list your account/org private repositories."
            exit 1
          fi

      - name: Sync profile from GitHub API
        run: bun run sync:github

      - name: Type-check
        run: bun run type-check

      - name: Build
        run: bun run build-only

      - name: Commit generated profile data
        run: |
          if git diff --quiet -- src/data/githubProfile.ts; then
            echo "No GitHub profile data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/githubProfile.ts
          git commit -m "chore: sync GitHub profile data"
          git push
